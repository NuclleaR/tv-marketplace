org.gradle.jvmargs=-Dfile.encoding=UTF-8 -XX:+ExitOnOutOfMemoryError -XX:MaxMetaspaceSize=1g -Xms1g -Xmx4g
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true
org.gradle.parallel=true
org.gradle.vfs.watch=true
org.gradle.priority=low
org.gradle.kotlin.dsl.allWarningsAsErrors=true

android.useAndroidX=true
android.nonTransitiveRClass=true
android.uniquePackageNames=true
android.defaults.buildfeatures.resvalues=false
android.defaults.buildfeatures.shaders=false
android.library.defaults.buildfeatures.androidresources=false

kotlin.daemon.useFallbackStrategy=false

# the root package: module namespaces are derived from it, e.g. com.serhii.tvmarketplace.features.home
app.rootPackage=com.serhii.tvmarketplace
app.warningsAsErrors=true
