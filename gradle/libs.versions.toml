[versions]
sdk-compile = "37"
sdk-min = "28"
sdk-target = "36"
sdk-robolectric = "35"
jvm-toolchain = "21"
jvm-bytecode = "17"

agp = "9.4.1"
kotlin = "2.4.21"
coroutines = "1.11.0"
metro = "1.5.0"
navigation3 = "1.2.0"
ktlint-core = "1.8.0"
ksp = "2.3.14"
ktor = "3.6.1"
room = "2.8.5"
ktlint-gradlePlugin = "0.14.0"
benchmark = "1.5.0"

[libraries]
androidPluginForGradle = { module = "com.android.tools.build:gradle", version.ref = "agp" }
kotlin-pluginForGradle = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-powerAssert = { module = "org.jetbrains.kotlin:kotlin-power-assert", version.ref = "kotlin" }
kotlin-powerAssert-runtime = { module = "org.jetbrains.kotlin:kotlin-power-assert-runtime", version.ref = "kotlin" }
compose-compiler-gradlePlugin = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }
ktlint-gradlePlugin = { module = "io.github.usefulness:ktlint-gradle-plugin", version.ref = "ktlint-gradlePlugin" }
ktlint-compose = "io.nlopez.compose.rules:ktlint:0.6.8"

androidx-core = "androidx.core:core-ktx:1.19.1"
coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
serialization-json = "org.jetbrains.kotlinx:kotlinx-serialization-json:1.12.0"

compose-bom = "androidx.compose:compose-bom:2026.09.00"
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-runtime-saveable = { module = "androidx.compose.runtime:runtime-saveable" }
compose-material3 = { module = "androidx.compose.material3:material3" }
activity-compose = "androidx.activity:activity-compose:1.13.0"
tv-material = "androidx.tv:tv-material:1.1.0"

ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktor-server-cio = { module = "io.ktor:ktor-server-cio", version.ref = "ktor" }
ktor-server-contentNegotiation = { module = "io.ktor:ktor-server-content-negotiation", version.ref = "ktor" }
ktor-server-testHost = { module = "io.ktor:ktor-server-test-host", version.ref = "ktor" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-contentNegotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }
ktor-serialization-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
room-testing = { module = "androidx.room:room-testing", version.ref = "room" }
datastore-preferences = "androidx.datastore:datastore-preferences:1.3.0"
lifecycle-process = "androidx.lifecycle:lifecycle-process:2.11.0"
zxing-core = "com.google.zxing:core:3.5.4"
coil-compose = "io.coil-kt.coil3:coil-compose:3.6.3"
coil-network-okhttp = "io.coil-kt.coil3:coil-network-okhttp:3.6.3"
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }

navigation3-runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "navigation3" }
navigation3-ui = { module = "androidx.navigation3:navigation3-ui", version.ref = "navigation3" }

junit = "junit:junit:4.13.2"
kotlin-testJunit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }
mockk = "io.mockk:mockk:1.14.11"
turbine = "app.cash.turbine:turbine:1.2.1"
molecule = "app.cash.molecule:molecule-runtime:2.2.0"
robolectric = "org.robolectric:robolectric:4.17"
composablePreviewScanner = "io.github.sergio-sastre.ComposablePreviewScanner:android:0.10.0"
androidx-test-core = "androidx.test:core-ktx:1.7.0"
androidx-test-junit = "androidx.test.ext:junit:1.3.0"
benchmark-macro = { module = "androidx.benchmark:benchmark-macro-junit4", version.ref = "benchmark" }
uiautomator = "androidx.test.uiautomator:uiautomator:2.4.1"
profileinstaller = "androidx.profileinstaller:profileinstaller:1.4.1"
tracing = "androidx.tracing:tracing:1.3.0"
tv-keyboard = "com.github.NuclleaR:tv-keyboard:v0.1.2"

[bundles]
compose = [
  "compose-ui",
  "compose-ui-tooling-preview",
  "compose-foundation",
  "compose-material3",
  "activity-compose",
]
testing-jvm = [
  "junit",
  "kotlin-testJunit",
  "coroutines-test",
  "mockk",
  "turbine",
  "robolectric",
  "androidx-test-core",
  "androidx-test-junit",
]

[plugins]
android-app = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
android-test = { id = "com.android.test", version.ref = "agp" }
baselineprofile = { id = "androidx.baselineprofile", version.ref = "benchmark" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
metro = { id = "dev.zacsweers.metro", version.ref = "metro" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
room = { id = "androidx.room", version.ref = "room" }
